name: NBA historical validation
on:
  pull_request:
    branches: [main]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect completed NBA season and evaluate
        run: |
          node nba-collect-history.js 2025 2 /tmp/nba-history.json
          node nba-backtest.js /tmp/nba-history.json recent5 > /tmp/recent5.json
          node nba-backtest.js /tmp/nba-history.json season > /tmp/season.json
          node -e "for (const name of ['recent5','season']) {const v=require('/tmp/'+name+'.json'); console.log(JSON.stringify({scope:name,evaluated:v.evaluated,skipped:v.skipped,metrics:v.metrics}));}"
