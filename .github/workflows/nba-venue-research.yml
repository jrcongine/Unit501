name: NBA venue source research
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check live NBA venue travel
        run: |
          node - <<'NODE'
          const publicFeed=require('./nba-public').createPublicNBA();
          const travel=require('./nba-travel').createNBATravel({publicFeed});
          (async()=>{
            const slate=await publicFeed.games('2026-10-27');
            const game=slate.games.find(g=>g.statusCode===1&&Date.parse(g.tipoff)>Date.now());
            if(!game)throw Error('No upcoming NBA game');
            const context=await publicFeed.context(game,slate.season); console.log(JSON.stringify({away:context.away.rest,previous:context.away.recentGames?.[0]})); const p=context.away.recentGames?.[0]; if(p){const x=await (await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+p.id)).json();console.log(JSON.stringify({id:p.id,venue:x.gameInfo?.venue,header:x.header?.competitions?.[0]?.competitors?.map(t=>({id:t.id,homeAway:t.homeAway}))}));} console.log(JSON.stringify({game:game.away+' at '+game.home,result:await travel(game,'2026-10-27',slate.season)}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
