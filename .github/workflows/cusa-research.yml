name: CUSA report research
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check current game notes
        run: |
          node - <<'NODE'
          const {parseNotes}=require('./college-injury-notes');
          (async()=>{
            const r=await fetch('https://kickoffstatus.com/games/2026-10-27-delaware-at-western-kentucky/');
            if(!r.ok)throw Error('Source unavailable');
            const game={game:{date:{timestamp:Date.parse('2026-10-27T23:00:00Z')/1000}},teams:{away:{name:'Delaware'},home:{name:'Western Kentucky'}}};
            const x=parseNotes(await r.text(),game,'2026',Date.now());
            console.log(JSON.stringify(x));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
