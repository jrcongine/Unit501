name: Unit 501 tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run regression tests
        run: npm test
      - name: Validate licensed nflverse team stats (informational)
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/probe-nflverse-team.js
      - name: Probe free NFL league stat sources (informational)
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/probe-nfl-public-stat.js
      - name: Check public War Room feeds (informational)
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/smoke-war-room.js
