name: College public feed inspection
on: [pull_request]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node <<'NODE'
          const feed=require('./ncaab-feed').createNCAAB();
          const players=require('./ncaab-players').createPlayers({feed});
          (async()=>{
            const slate=await feed.games('2026-02-28');
            const game=slate.games.find(g=>g.timeKnown&&g.stage===2&&g.status==='Final');
            if(!game)throw Error('No historical game');
            const i=await players.injuries(game);
            const h=await players.history(game);
            console.log('Public-source validation',game.away,game.home, 'injury teams',i.teams.length,'history coverage',h.teams.map(t=>({games:t.games,players:t.players.length})));
            if(h.teams.every(t=>!t.available))throw Error('No verified historical boxes');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          NODE
