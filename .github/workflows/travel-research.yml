name: Football venue research
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check current and prior venue resolution
        run: |
          node - <<'NODE'
          const {resolveVenue}=require('./game-venue');
          (async()=>{
            for(const [date,away,home] of [['20261027','Sam Houston','Missouri State'],['20261014','Western Kentucky','Sam Houston']]){
              const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates='+date+'&limit=1000&groups=80');
              const j=await r.json();
              const options=(j.events||[]).flatMap(e=>(e.competitions||[]).filter(c=>(c.competitors||[]).some(t=>t.homeAway==='home'&&JSON.stringify(t.team).toLowerCase().includes(home.toLowerCase()))&&(c.competitors||[]).some(t=>t.homeAway==='away'&&JSON.stringify(t.team).toLowerCase().includes(away.toLowerCase()))));
              if(options.length!==1){console.log('NOT FOUND',date,away,home,options.length);continue;}
              const q={league:'2',season:'2026',kickoff:Date.parse(options[0].date),away,home};
              console.log(JSON.stringify({q,venue:await resolveVenue(q)}));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
