name: College basketball source research
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate college basketball live source
        run: |
          node - <<'NODE'
          const {createNCAAB}=require('./ncaab-feed');
          (async()=>{
           const feed=createNCAAB();
           const slate=await feed.games('2026-11-02');
           console.log(JSON.stringify({date:slate.date,count:slate.games.length,tbd:slate.games.filter(g=>!g.timeKnown).length,first:slate.games[0]}));
           const historic=await feed.games('2026-02-14');
           const game=historic.games.find(g=>g.timeKnown&&g.stage===2&&g.status==='Final');
           if(!game)throw Error('No completed historical matchup');
           const context=await feed.context(game);
           console.log(JSON.stringify({game:game.away+' at '+game.home,awayGames:context.away.games,homeGames:context.home.games,awayLast:context.away.recentGames[0],homeLast:context.home.recentGames[0]}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
