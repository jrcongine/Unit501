name: College basketball source research
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect college basketball data
        run: |
          node - <<'NODE'
          (async()=>{
           const root='https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball';
           for(const date of ['20261102','20261109','20260320']){
            const data=await (await fetch(root+'/scoreboard?dates='+date+'&groups=50&limit=500')).json();
            const e=data.events?.[0];console.log(JSON.stringify({date,count:data.events?.length,leagues:data.leagues?.map(x=>({id:x.id,slug:x.slug,abbr:x.abbreviation})),sample:e&&{id:e.id,date:e.date,season:e.season,competition:e.competitions?.[0]}}));
           }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
